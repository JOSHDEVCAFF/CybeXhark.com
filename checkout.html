<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="CybexIcon.png" type="image/x-icon">
    <title>Checkout - Cybexhark</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;    
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 50%, rgba(0, 0, 0, 0.7) 50%), url('gym.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            color: #fff;
        }
         body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg,
                    rgba(8,8,8,.97),
                    rgba(8,8,8,.88)),
                url('gym.jpg') center/cover no-repeat;
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle,
                rgba(150,0,20,.16),
                transparent 70%);
            top: 10%;
            left: -250px;
            z-index: -1;
            pointer-events: none;
        }

        /* Navbar Styles */
        .navbar {
    background:linear-gradient(black,rgba(0, 0, 0, 0.692)); 
    color: white;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width:100%;
    border: 2px solid black;
}

.navbar .logo {
    color: rgb(177, 0, 0);
    margin-top: 5px;
    font-size: 25px;
    font-family: 'Times New Roman', Times, serif;
    flex-grow: 0; /* Ensures the logo grows to take available space */
    padding-left:10px;  
    text-shadow: 0px 5px 8px #4d0000;
    position: relative;
}

.navbar .menu ul {
    display:flex;
    justify-content: center;
}

.navbar .menu ul li { 
    display:flex;
    text-align: center
    list-style: none;
    padding-left: 150px;
    margin-top: 15px;
    font-size: 11px;
}

.menu ul li a {
    text-decoration: none;
    color: #fff;    
    font-family: Arial;
    font-weight: bold;
    transition: 0.4s ease-in-out;
}

.navbar .menu ul li a:hover {
    color: rgb(207, 0, 0);
    text-shadow: 0px 0px 4px rgba(182, 0, 0, 0.794);
}
        /* Checkout Section */
        .content {
    text-align: center;
    padding: 100px 20px;
}

        #cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px auto;
            width: 80%;
            max-width: 900px;
        }

        .cart-item {
            background: rgba(0, 0, 0, 0.63);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 20px 20px 40px rgb(0, 0, 0);
            display: flex;
            align-items: center;
            gap: 20px; 
        }

        .cart-item img {
            width: 150px;  
            height: 150px; 
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-item .item-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%; 
        }

        .cart-item h3 {
            font-size: 20px;
            font-weight: bold;
        }

        .cart-item p {
            font-size: 16px;
        }

        #total-cost {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-top: 20px;
        }

        #checkout-buttons {
            margin-top: 30px;
        }

        #checkout-buttons button {
            background-color: #333;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        #checkout-buttons button:hover {
            background-color: darkred;
            transform: translateY(-3px);
            border: none;
        }

        /* Empty Cart Message */
        .empty-cart-message {
            color: #ffffff69;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        #back{
            background-color: #333;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        :root {
            color-scheme: dark;
            --checkout-accent: #ef3434;
            --checkout-muted: #aeb3bb;
        }

        html {
            min-width: 320px;
        }

        body {
            min-height: 100vh;
            height: auto;
            background:
                linear-gradient(180deg, rgba(8, 9, 11, 0.86), #0b0c0f 42rem),
                url('gym.jpg') center top / cover fixed;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            justify-content: center;
            padding: 14px clamp(18px, 5vw, 72px);
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
            background: rgba(10, 11, 13, 0.92);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(14px);
        }

        .navbar .menu {
            width: min(1200px, 100%);
        }

        .navbar .menu ul {
            align-items: center;
            flex-wrap: wrap;
            gap: 6px clamp(12px, 2.2vw, 30px);
            list-style: none;
        }

        .navbar .menu ul li {
            display: block;
            margin: 0;
            padding: 0;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
        }

        .navbar .logo {
            margin: 0;
            padding: 0;
            color: #f7f7f8;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.07em;
            text-shadow: none;
        }

        .navbar .logo::first-letter {
            color: var(--checkout-accent);
        }

        .menu ul li a {
            display: inline-block;
            padding: 9px 0;
            color: #d5d7dc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar .menu ul li a:hover,
        .navbar .menu ul li a:focus-visible {
            color: var(--checkout-accent);
            text-shadow: none;
        }

        .content {
            width: min(1000px, 100%);
            margin: 0 auto;
            padding: clamp(38px, 7vw, 76px) clamp(16px, 4vw, 36px) 64px;
            text-align: left;
        }

        .checkout-heading {
            margin-bottom: 30px;
            text-align: center;
        }

        .checkout-eyebrow {
            margin-bottom: 10px;
            color: var(--checkout-accent);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.2em;
        }

        .checkout-heading h1 {
            margin-bottom: 10px;
            color: #fff;
            font-size: clamp(2.15rem, 6vw, 3.6rem);
            letter-spacing: -0.06em;
        }

        .checkout-heading > p:last-child {
            color: var(--checkout-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        #cart-items {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            gap: 14px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 128px minmax(0, 1fr);
            gap: 8px 20px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(31, 34, 39, 0.97), rgba(18, 20, 23, 0.97));
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
            text-align: left;
        }

        .cart-item img {
            grid-row: 1 / span 5;
            width: 128px;
            height: 128px;
            border-radius: 11px;
            object-fit: contain;
            background: #f5f5f3;
            box-shadow: none;
        }

        .cart-item h3 {
            align-self: end;
            color: #fff;
            font-size: 1.1rem;
            text-shadow: none;
        }

        .cart-item p {
            color: var(--checkout-muted);
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .cart-item p:nth-of-type(2) {
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        .cart-item .quantity {
            width: 76px;
            margin-left: 6px;
            padding: 6px 8px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            background: #101114;
            color: #fff;
            font: inherit;
        }

        .cart-item button {
            justify-self: start;
            margin: 2px 0 0;
            padding: 8px 13px;
            border: 1px solid rgba(239, 52, 52, 0.5);
            border-radius: 7px;
            background: rgba(239, 52, 52, 0.12);
            color: #ff8585;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .cart-item button:hover {
            background: var(--checkout-accent);
            color: #fff;
        }

        #total-cost {
            width: min(820px, 100%);
            margin: 20px auto 0;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1.3rem;
            text-align: right;
        }

        .empty-cart-message {
            width: min(820px, 100%);
            margin: 0 auto;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--checkout-muted);
        }

        #checkout-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }

        #checkout-buttons button,
        #back {
            min-width: 150px;
            margin: 0;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 9px;
            background: #25282e;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 750;
        }

        #checkout-buttons #confirm-order {
            border-color: var(--checkout-accent);
            background: var(--checkout-accent);
        }

        #checkout-buttons button:hover,
        #back:hover {
            transform: translateY(-2px);
            background: #c9272d;
        }

        .cart-item button:focus-visible,
        #checkout-buttons button:focus-visible,
        .cart-item input:focus-visible,
        .navbar a:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 12px 18px;
            }

            .navbar .menu ul {
                justify-content: flex-start;
                gap: 2px 18px;
            }

            .navbar .menu ul li {
                font-size: 0.67rem;
            }

            .content {
                padding-top: 42px;
            }
        }

        @media (max-width: 520px) {
            .cart-item {
                grid-template-columns: 84px minmax(0, 1fr);
                gap: 7px 13px;
                padding: 13px;
            }

            .cart-item img {
                width: 84px;
                height: 84px;
                grid-row: 1 / span 5;
            }

            .cart-item h3 {
                font-size: 0.98rem;
            }

            .cart-item p {
                font-size: 0.8rem;
            }

            #checkout-buttons {
                flex-direction: column;
            }

            #checkout-buttons button,
            #back {
                width: 100%;
            }
        }

    </style>
    <script>
        if (!localStorage.getItem('loggedInUser')) {
            window.location.replace('login.html?returnTo=checkout.html');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="cybex-theme.css">
</head>
<body>

    <div class="main">
        <header class="responsive-site-header">
            <nav class="responsive-site-nav" aria-label="Main navigation">
                <a class="dashboard-brand" href="index.html" aria-label="Cybexhark home">
                    <span class="dashboard-brand-mark" aria-hidden="true"><i class="fa-solid fa-dumbbell"></i></span>
                    <span class="dashboard-brand-wordmark"><span class="dashboard-brand-name">CYBE<span>X</span>HARK</span><small>TRAIN WITH PURPOSE</small></span>
                </a>
                <button class="site-menu-toggle" type="button" aria-controls="site-menu" aria-expanded="false" aria-label="Open navigation menu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
                <div class="site-menu" id="site-menu" aria-label="Site pages">
                    <button class="site-menu-close" type="button" aria-label="Close navigation menu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                    <a class="dashboard-brand site-menu-brand" href="index.html" aria-label="Cybexhark home">
                        <span class="dashboard-brand-mark" aria-hidden="true"><i class="fa-solid fa-dumbbell"></i></span>
                        <span class="dashboard-brand-wordmark"><span class="dashboard-brand-name">CYBE<span>X</span>HARK</span><small>TRAIN WITH PURPOSE</small></span>
                    </a>
                    <h2 class="site-menu-title">Menu</h2>
                    <ul class="site-menu-links">
                        <li><a href="index.html"><i class="fa-solid fa-house" aria-hidden="true"></i>HOME</a></li><li><a href="about.html"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>ABOUT</a></li>
                        <li><a href="service.html"><i class="fa-solid fa-dumbbell" aria-hidden="true"></i>SERVICE</a></li><li><a href="shop.html"><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>SHOP</a></li>
                        <li><a href="contact.html"><i class="fa-solid fa-envelope" aria-hidden="true"></i>CONTACT</a></li><li><a href="organizational-chart.html"><i class="fa-solid fa-sitemap" aria-hidden="true"></i>ORG CHART</a></li><li><a href="profile.html"><i class="fa-solid fa-user" aria-hidden="true"></i>PROFILE</a></li><li><a href="dashboard.html"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>DASHBOARD</a></li>
                    </ul>
                </div>
                <button class="site-menu-backdrop" type="button" aria-label="Close navigation menu" hidden></button>
            </nav>
        </header>
        <div class="content">
                    <header class="checkout-heading">
                        <p class="checkout-eyebrow">YOUR ORDER</p>
                        <h1>Checkout</h1>
                        <p>Review your items and quantities before continuing to payment.</p>
                    </header>
            <div id="cart-items"></div>
            <div id="total-cost"></div>

            <!-- Empty Cart Message -->
            <div id="empty-cart-message" class="empty-cart-message" style="display: none;">
                You don’t have an order yet. Please place an order.
            </div>

            <div id="checkout-buttons">
                <button id="confirm-order">Confirm Order</button>
                <button id="cancel-order">Cancel Order</button>
                <button id="back"><a href="shop.html" style="color: white; text-decoration: none;">Back</a></button>
            </div>
            
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || []; // Retrieve cart from localStorage

        // Function to update the cart UI
        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const totalCostDiv = document.getElementById('total-cost');
            const emptyCartMessage = document.getElementById('empty-cart-message');

            cartItemsDiv.innerHTML = '';
            let totalCost = 0;

            if (cart.length === 0) {
                emptyCartMessage.style.display = 'block'; // Show the empty cart message
            } else {
                emptyCartMessage.style.display = 'none'; // Hide the empty cart message
            }

            cart.forEach((item, index) => {
                cartItemsDiv.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" loading="lazy" decoding="async">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <p>Price: $${item.price}</p>
                        <p>Quantity: 
                            <input type="number" value="${item.quantity}" min="1" id="quantity-${index}" class="quantity">
                        </p>
                        <button onclick="removeItem(${index})">Remove</button>
                    </div>
                    <style>
                        h3{
                         text-shadow: 2px 2px 4px rgb(1, 1, 1);
                         font-weight: bold;
                        }
                         img{
                         box-shadow:20px 20px 40px rgb(0, 0, 0);
                         }
                         button{
                         padding: 5px 5px;
                         transition: background-color 0.3s ease, transform 0.3s ease;
                         border-radius: 5px;
                         border: none;
                         }
                         button:hover{
                         background: darkred;
                         border:none;
                         color: white;
                         }
                        </style>
                `;

                totalCost += item.price * item.quantity;
            });

            totalCostDiv.innerHTML = `Total: $${totalCost.toFixed(2)}`;
        }

        // Update cart when quantity is changed
        document.body.addEventListener('input', function(e) {
            if (e.target.classList.contains('quantity')) {
                const index = e.target.id.split('-')[1];
                const newQuantity = parseInt(e.target.value, 10);
                cart[index].quantity = newQuantity;
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCart();
            }
        });

        // Remove item from cart
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCart();
        }

        // Confirm order
        document.getElementById('confirm-order').addEventListener('click', () => {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            const user = JSON.parse(localStorage.getItem('loggedInUser') || 'null');
            if (!user || !user.username) {
                window.location.href = 'login.html?returnTo=checkout.html';
                return;
            }

            const items = cart.map(item => ({
                name: item.name || item.title || 'Product',
                image: item.image || item.img || '',
                quantity: Number(item.quantity) || 1,
                price: Number(item.price) || 0
            }));
            const total = items.reduce((sum, item) => sum + item.price * item.quantity, 0);
            localStorage.setItem('pendingOrder', JSON.stringify({
                id: `CY-${Date.now().toString(36).toUpperCase()}`,
                username: user.username,
                createdAt: new Date().toISOString(),
                items,
                total
            }));
            window.location.href = 'payment.html';
        });

        // Cancel order
        document.getElementById('cancel-order').addEventListener('click', () => {
            localStorage.removeItem('cart');
            localStorage.removeItem('pendingOrder');
            window.location.href = 'shop.html'; // Redirect to shop page
        });

        // Initialize the cart
        updateCart();

    </script>
    <script src="cybex-navigation.js" defer></script>
    <script src="cybex-motion.js" defer></script>
</body>
</html>
